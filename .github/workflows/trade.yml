name: Trade

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers (e.g. AAPL,MSFT,GOOGL)"
        required: true
        default: "AAPL,MSFT,GOOGL,AMZN,NVDA,META,TSLA,JPM,V"
      dry_run:
        description: "Dry run (pre-check only, no real orders)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      refresh_cache:
        description: "Refresh financial data cache"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      model:
        description: "LLM model"
        required: false
        default: "gpt-4o"

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . --quiet

      - name: Restore financial data cache
        uses: actions/cache@v5
        with:
          path: .cache/financial_data.json
          key: financial-cache-${{ inputs.refresh_cache == 'true' && github.run_id || 'stable' }}
          restore-keys: |
            financial-cache-

      - name: Check Saxo token expiry
        run: |
          python -c "
          import base64, json, time, sys
          token = '${{ secrets.SAXO_ACCESS_TOKEN }}'
          try:
              payload = json.loads(base64.b64decode(token.split('.')[1] + '==').decode())
              exp = int(payload.get('exp', 0))
              remaining = exp - time.time()
              hours = remaining / 3600
              if remaining <= 0:
                  print('ERROR: Saxo token has EXPIRED. Update SAXO_ACCESS_TOKEN secret at:')
                  print('https://www.developer.saxo/openapi/token/current')
                  sys.exit(1)
              elif remaining < 3600:
                  print(f'WARNING: Token expires in {remaining/60:.0f} minutes!')
              else:
                  print(f'OK: Token valid for {hours:.1f} hours')
          except Exception as e:
              print(f'ERROR: Could not parse token: {e}')
              sys.exit(1)
          "

      - name: Run AI Hedge Fund → Saxo
        run: |
          ARGS="--ticker ${{ inputs.tickers }} --model ${{ inputs.model }} --auto-approve"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.refresh_cache }}" = "true" ]; then ARGS="$ARGS --refresh-cache"; fi
          ARGS="$ARGS --options --options-ticker QQQ --options-budget 200"
          echo "Running: py saxo_run.py $ARGS"
          python saxo_run.py $ARGS
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINANCIAL_DATASETS_API_KEY: ${{ secrets.FINANCIAL_DATASETS_API_KEY }}
          SAXO_ACCESS_TOKEN: ${{ secrets.SAXO_ACCESS_TOKEN }}
